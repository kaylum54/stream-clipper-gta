name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest   # the recorder, launcher and process handling target Windows first
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: static
        run: |
          python -m ruff check .
          Get-ChildItem web -Filter *.js | ForEach-Object { node --check $_.FullName }
      - name: unit, integration, contract, review
        run: python -m pytest -q
      - name: browser
        run: python -m pytest e2e -o python_files=e2e_*.py -q
